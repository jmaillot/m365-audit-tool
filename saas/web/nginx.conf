server {
  listen 80;
  root /usr/share/nginx/html;
  # NOTE: resolver + variable (not a static proxy_pass host) so nginx
  # re-resolves `api` per request. A static host is resolved ONCE at
  # startup: every api recreation (rebuild, rename) then 502s with
  # "Connection refused" to a stale IP until web is restarted.
  location /api/ { resolver 127.0.0.11 valid=10s; set $api http://api:8080; proxy_pass $api; proxy_set_header Authorization $http_authorization; proxy_set_header X-Tenant-Id $http_x_tenant_id; proxy_set_header X-Graph-Token $http_x_graph_token; proxy_set_header X-Power-Token $http_x_power_token; }
  # Admin tool: never cache the UI so rebuilds always reach the browser.
  location ~* \.(js|css|html)$ { expires -1; add_header Cache-Control "no-store, must-revalidate"; }
  location / { try_files $uri $uri/ /index.html; }
}
