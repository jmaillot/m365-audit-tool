services:
  api:
    build: ./api
    ports: ["8080:8080"]
    env_file: .env
    environment:
      MAT_DATA_DIR: /data
      MAT_WORKER_URL: http://worker:8081
    volumes: [audit-data:/data]
    depends_on: [worker]
  worker:
    build:
      context: ./worker
      args:
        CSV_REFRESH_TOKEN: ${CSV_REFRESH_TOKEN:-2026-01}
    environment:
      MAT_DATA_DIR: /data
      MAT_AUDIT_TIMEOUT_SEC: 1800
      # true = fake CSVs without Exchange (UI testing). false = real EXO calls.
      MAT_DEMO_MODE: ${MAT_DEMO_MODE:-false}
    volumes: [audit-data:/data]
  web:
    build: ./web
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on: [api]

volumes:
  audit-data:
